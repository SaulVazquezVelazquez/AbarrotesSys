services:
  - type: web
    name: credito-facil
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /healthz
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: credito-facil-db
          property: connectionString

databases:
  - name: credito-facil-db
    plan: free
    region: ohio
    databaseName: credito_facil
    user: credito_facil
