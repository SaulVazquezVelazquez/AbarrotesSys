services:
  - type: web
    name: tienda-y-abarrotes
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /healthz
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-y-abarrotes-db
          property: connectionString

databases:
  - name: tienda-y-abarrotes-db
    plan: free
    region: ohio
    databaseName: tienda_abarrotes
    user: tienda_abarrotes
